<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans Mono','JetBrains Mono',monospace">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#162233"/>
      <stop offset="55%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="termBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151b24"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee78733"/>
      <stop offset="100%" stop-color="#7ee78700"/>
    </radialGradient>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a313c"/>
    </pattern>
    <marker id="arrowAmber" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e3b341"/>
    </marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#ff7b72"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGlow)"/>
  <rect width="1000" height="1000" fill="url(#dotgrid)" opacity="0.6"/>

  <!-- faint orbit rings -->
  <g fill="none" stroke="#1f2733" stroke-width="2">
    <circle cx="500" cy="500" r="320"/>
    <circle cx="500" cy="500" r="245"/>
  </g>

  <!-- ===== Signal layer: interrupt bolt striking down from above ===== -->
  <g>
    <path d="M500 150 L484 210 L508 210 L486 278"
          fill="none" stroke="#ff7b72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M486 278 Q 486 320 500 352" fill="none" stroke="#ff7b72" stroke-width="2.4" marker-end="url(#arrowRed)" opacity="0.9"/>
    <circle cx="500" cy="150" r="7" fill="#ff7b72"/>
  </g>

  <!-- ===== Byte-stream / histogram layer: bars feeding in from the left ===== -->
  <g transform="translate(150,560)">
    <g stroke="#30363d">
      <line x1="0" y1="110" x2="230" y2="110"/>
    </g>
    <!-- byte bars of varying height, amber, rising toward the terminal -->
    <rect x="0"   y="86"  width="16" height="24" fill="#e3b341" opacity="0.55"/>
    <rect x="24"  y="70"  width="16" height="40" fill="#e3b341" opacity="0.65"/>
    <rect x="48"  y="40"  width="16" height="70" fill="#e3b341" opacity="0.8"/>
    <rect x="72"  y="58"  width="16" height="52" fill="#e3b341" opacity="0.7"/>
    <rect x="96"  y="20"  width="16" height="90" fill="#e3b341" opacity="0.95"/>
    <rect x="120" y="64"  width="16" height="46" fill="#e3b341" opacity="0.7"/>
    <rect x="144" y="48"  width="16" height="62" fill="#e3b341" opacity="0.8"/>
    <path d="M168 70 Q 230 60 280 10" fill="none" stroke="#e3b341" stroke-width="2.2" marker-end="url(#arrowAmber)" opacity="0.9"/>
  </g>

  <!-- ===== Network layer: two endpoint nodes with a connection passing through ===== -->
  <g>
    <circle cx="790" cy="420" r="20" fill="#0d1b2d" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="840" cy="500" r="20" fill="#0d1b2d" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="790" cy="580" r="20" fill="#0d1b2d" stroke="#58a6ff" stroke-width="2.5"/>
    <path d="M771 428 Q 700 460 662 486" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M820 500 Q 740 500 672 500" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M771 572 Q 700 540 662 514" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ===== Central terminal / process window ===== -->
  <g transform="translate(500,500)">
    <circle r="150" fill="url(#coreGlow)"/>

    <rect x="-130" y="-95" width="260" height="190" rx="12" fill="url(#termBody)" stroke="#2f3744" stroke-width="2.5"/>
    <!-- title bar -->
    <rect x="-130" y="-95" width="260" height="30" rx="12" fill="#1a2029"/>
    <rect x="-130" y="-80" width="260" height="15" fill="#1a2029"/>
    <circle cx="-108" cy="-80" r="5.5" fill="#ff5f56"/>
    <circle cx="-90" cy="-80" r="5.5" fill="#ffbd2e"/>
    <circle cx="-72" cy="-80" r="5.5" fill="#27c93f"/>

    <!-- body: a line of text with a highlighted match -->
    <g font-size="13" font-family="'DejaVu Sans Mono',monospace">
      <text x="-108" y="-38" fill="#6e7681">$ scan --watch</text>
      <text x="-108" y="-10" fill="#8b949e">input: </text>
      <rect x="-56" y="-22" width="54" height="18" rx="3" fill="#4d1414"/>
      <text x="-50" y="-10" fill="#ff7b72" font-weight="bold">match</text>
      <text x="-108" y="18" fill="#8b949e">bytes: 0x4A 0x3F</text>
    </g>

    <!-- blinking cursor -->
    <rect x="-108" y="30" width="9" height="16" fill="#7ee787">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="-92" y="44" font-size="13" fill="#7ee787">ready</text>

    <!-- connector nubs where the byte stream / network lines attach -->
    <circle cx="-130" cy="-10" r="4" fill="#e3b341"/>
    <circle cx="130" cy="0" r="4" fill="#58a6ff"/>
    <circle cx="0" cy="-95" r="4" fill="#ff7b72"/>
  </g>
</svg>
